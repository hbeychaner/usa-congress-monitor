server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app: unknown paths fall back to the router.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
