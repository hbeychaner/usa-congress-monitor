[project]
name = "congress-tracker"
version = "0.1.0"
description = "Congress.gov data collection, ingestion, and analysis toolkit"
requires-python = ">=3.13"

dependencies = [
    "aio-pika==9.6.1",
    "aiohttp==3.13.3",
    "bs4==0.0.2",
    "celery>=5.4,<6",
    "chromedriver-py==134.0.6998.88",
    "dataclasses-json==0.6.7",
    "elasticsearch==9.3.0",
    "openai==1.61.1",
    "plotly==5.18.0",
    "PyPDF2==3.0.1",
    "python-dotenv==1.0.1",
    "selenium==4.11.0",
    "smolagents==1.8.1",
    "streamlit==1.42.0",
    "streamlit_agraph==0.0.45",
    "pydantic>=2.0",
    "requests",
    "redis>=5.0,<6",
    # Congress.gov SDK — switch to git+https://github.com/hbeychaner/pycongress.git after push
    "pycongress",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cdm"]

[tool.pytest.ini_options]
# pytest.ini already present; these are duplicated here for uv-managed envs
testpaths = ["tests"]

[tool.uv.sources]
pycongress = { path = "../pycongress" }
