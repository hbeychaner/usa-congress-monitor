[project]
name = "congress-tracker"
version = "0.1.0"
description = "Congress.gov data collection, ingestion, and analysis toolkit"
requires-python = ">=3.13"

dependencies = [
    "bs4==0.0.2",
    "celery>=5.4,<6",
    "fastapi>=0.116.0,<1",
    "elasticsearch==9.3.0",
    "openai==1.61.1",
    "python-dotenv==1.0.1",
    "uvicorn[standard]>=0.35.0,<1",
    "pydantic>=2.0",
    "requests",
    "redis>=5.0,<6",
    "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cdm"]

[tool.pytest.ini_options]
# pytest.ini already present; these are duplicated here for uv-managed envs
testpaths = ["tests"]
