x-python: &python
  build:
    context: .
    dockerfile: Dockerfile.python
    target: api
  working_dir: /workspace
  restart: unless-stopped
  stop_grace_period: 60s
  cpus: 1
  mem_limit: 512m
  env_file: .env
  extra_hosts:
    - host.docker.internal:host-gateway
  environment: &python_environment
    RABBITMQ_URL: ${CONTAINER_RABBITMQ_URL:-amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@host.docker.internal:${RABBITMQ_PORT:-5672}/${RABBITMQ_DEFAULT_VHOST:-/}}
    REDIS_URL: redis://host.docker.internal:6379/0
    ES_LOCAL_URL: http://host.docker.internal:${ES_LOCAL_PORT:-9200}
    OLLAMA_URL: ${CONTAINER_OLLAMA_URL:-http://host.docker.internal:11434}
    TOKENIZERS_PARALLELISM: "false"
  volumes:
    - ./:/workspace
    - ${PWD:?Run Compose from the repository root}:${PWD}

services:
  backend:
    <<: *python
    command: ["uvicorn", "cdm.backend.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/workspace/cdm"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker: &worker
    <<: *python
    build:
      context: .
      dockerfile: Dockerfile.python
      target: analysis
    profiles: [acquisition]
    cpus: ${WORKER_CPUS:-2}
    mem_limit: ${WORKER_MEMORY:-2g}
    command: celery -A cdm.workers.celery_app:celery_app worker --pool=prefork --concurrency=8 --max-tasks-per-child=50 --loglevel=INFO --queues=${CELERY_INGEST_QUEUE:-congress-ingest}
    depends_on:
      backend:
        condition: service_healthy

  worker-bulk:
    <<: *worker
    command: celery -A cdm.workers.celery_app:celery_app worker --pool=prefork --concurrency=1 --max-tasks-per-child=50 --loglevel=INFO --queues=${CELERY_BULK_QUEUE:-congress-bulk},${CELERY_TASK_QUEUE:-congress-sync}

  worker-maintenance:
    <<: *worker
    profiles: [dedicated]
    command: celery -A cdm.workers.celery_app:celery_app worker --pool=prefork --concurrency=1 --max-tasks-per-child=200 --loglevel=INFO --queues=${CELERY_MAINTENANCE_QUEUE:-congress-maintenance}

  worker-analytics:
    <<: *worker
    profiles: [analytics]
    cpus: ${ANALYTICS_CPUS:-2}
    mem_limit: ${ANALYTICS_MEMORY:-8g}
    command: celery -A cdm.workers.celery_app:celery_app worker --pool=prefork --concurrency=1 --max-tasks-per-child=1 --loglevel=INFO --queues=${CELERY_ANALYTICS_QUEUE:-congress-analytics}

  worker-index:
    <<: *worker
    profiles: [dedicated]
    command: celery -A cdm.workers.celery_app:celery_app worker --pool=prefork --concurrency=2 --max-tasks-per-child=200 --loglevel=INFO --queues=${CELERY_INDEX_QUEUE:-congress-index}

  beat:
    <<: *worker
    profiles: [scheduler]
    command: ["celery", "-A", "cdm.workers.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=data/celerybeat-schedule"]

  worker-operations:
    <<: *worker
    profiles: [operations]
    mem_limit: ${OPERATIONS_MEMORY:-1g}
    command: celery -A cdm.workers.celery_app:celery_app worker --hostname=operations@%h --pool=prefork --concurrency=1 --max-tasks-per-child=200 --loglevel=INFO --queues=${CELERY_INDEX_QUEUE:-congress-index},${CELERY_MAINTENANCE_QUEUE:-congress-maintenance}

  frontend:
    build:
      context: frontend/app
      dockerfile: Dockerfile
    restart: unless-stopped
    cpus: 1
    mem_limit: 256m
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend/app:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
