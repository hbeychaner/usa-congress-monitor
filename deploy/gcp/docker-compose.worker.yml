x-app: &app
  image: ${BACKEND_IMAGE}
  working_dir: /workspace
  env_file: .env
  restart: unless-stopped
  volumes:
    - /mnt/data/data:/workspace/data
    - /mnt/data/logs:/workspace/logs
    - /mnt/data/models:/workspace/models
  depends_on:
    - rabbitmq
    - redis

services:
  backend:
    <<: *app
    command: uvicorn cdm.backend.app:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"

  rabbitmq:
    image: rabbitmq:3.13-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  worker:
    <<: *app
    command: >
      celery -A cdm.workers.celery_app:celery_app worker --pool=prefork --concurrency=8 --max-tasks-per-child=50 --loglevel=INFO --queues=congress-ingest

  worker-index:
    <<: *app
    command: >
      celery -A cdm.workers.celery_app:celery_app worker --pool=prefork --concurrency=2 --max-tasks-per-child=200 --loglevel=INFO --queues=congress-index

  worker-bulk:
    <<: *app
    command: >
      celery -A cdm.workers.celery_app:celery_app worker --pool=prefork --concurrency=1 --max-tasks-per-child=50 --loglevel=INFO --queues=congress-bulk,congress-sync

  worker-maintenance:
    <<: *app
    command: >
      celery -A cdm.workers.celery_app:celery_app worker --pool=prefork --concurrency=1 --max-tasks-per-child=200 --loglevel=INFO --queues=congress-maintenance

  worker-analytics:
    <<: *app
    cpus: ${ANALYTICS_CPUS:-2}
    mem_limit: ${ANALYTICS_MEMORY:-8g}
    environment:
      TOKENIZERS_PARALLELISM: "false"
    command: >
      celery -A cdm.workers.celery_app:celery_app worker --pool=prefork --concurrency=1 --max-tasks-per-child=1 --loglevel=INFO --queues=congress-analytics

  beat:
    <<: *app
    command: >
      celery -A cdm.workers.celery_app:celery_app beat --loglevel=INFO --schedule=/workspace/data/celerybeat-schedule

volumes:
  rabbitmq-data:
  redis-data:
